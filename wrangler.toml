name = "scenetest-cloud"
account_id = "dd3bee1c1159eb67e1a2249f83e2b4c4"
main = "src/worker/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
# Upload source maps so stack traces in Workers Logs point at TypeScript
# source instead of bundled positions.
upload_source_maps = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[assets]
directory = "dist/dashboard"
binding = "ASSETS"
# SPA mode: any path that doesn't match a static asset returns index.html
# (200). Without this, deep links like /404 or /admin land on the assets
# handler's own 404 instead of letting the SPA render its own page.
not_found_handling = "single-page-application"

# One Durable Object per PR (SQLite-backed): terminates the box's outbound
# WebSocket, queues commands/dispatches, and owns the PR's event log in its
# own SQLite (flushed to R2 at end of run; D1 never holds log lines).
[durable_objects]
bindings = [
  { name = "PR_COORDINATOR", class_name = "PrCoordinator" },
  # Singleton above the per-PR coordinators: holds the home view's live tile
  # cache and fans rollups out to home-dashboard WebSocket subscribers.
  { name = "HOME_COORDINATOR", class_name = "HomeCoordinator" },
  # One per PR with a hosted preview environment: it owns the poll schedule
  # while the PR's Supabase branch builds (docs/preview-environments.md).
  { name = "PREVIEW_COORDINATOR", class_name = "PreviewCoordinator" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PrCoordinator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["HomeCoordinator"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["PreviewCoordinator"]

[[d1_databases]]
binding = "DB"
database_name = "scenetest-cloud-mhsnook"
database_id = "59cdeb29-a690-46b8-a8f9-423be56ed4d8"
migrations_dir = "migrations"

# Durable record of run event logs. At end of run the PR object flushes its
# log to a per-run `.jsonl` object here (the cron is an archive backstop).
# Create the bucket once: `wrangler r2 bucket create
# scenetest-cloud-artifacts` (see docs/setup.md).
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "scenetest-cloud-artifacts"

# Reaper for ephemeral runner boxes (no-op while RUNNER_PROVIDER = "stub") and
# the R2 artifact/prune sweep (runs regardless of provider).
[triggers]
crons = ["*/10 * * * *"]

[vars]
GITHUB_OAUTH_CLIENT_ID = "Iv23lirXMXY2Wpn6xdx5"
# Runner provisioning: "stub" fabricates events in-worker; "digitalocean"
# spawns one droplet per run (requires the DO vars below + DO_API_TOKEN
# secret — see docs/runner-provisioning.md).
RUNNER_PROVIDER = "stub"
# RUNNER_REGION = "nyc3"
# RUNNER_SIZE = "s-2vcpu-4gb"
# RUNNER_IMAGE: do not set normally — the runner image builds and caches
# itself (stage_cache). Setting it pins a specific snapshot id, bypassing
# the self-built one (escape hatch; see docs/runner-provisioning.md).
# PUBLIC_BASE_URL = "https://scenetest-cloud.<account>.workers.dev"
# Idle teardown (primary): the PR coordinator's Durable Object alarm retires a
# box this many minutes after its last activity, once its runs have settled.
# RUNNER_IDLE_TIMEOUT_MINUTES = "5"
# Hung-box backstop: the reaper hard-kills any box older than this regardless of
# run state, catching boxes the idle alarm never retired.
# RUNNER_MAX_AGE_MINUTES = "30"
# Bootstrap: first user whose GitHub login matches gets auto-inserted into
# allowed_user when the table is empty. Set this to your own login before the
# first deploy; can be left as-is afterward (the bootstrap path is a no-op
# once allowed_user is non-empty).
BOOTSTRAP_ALLOWED_LOGIN = "mhsnook"
# Hosted preview environments (docs/preview-environments.md): a PR whose
# pipeline file declares a `preview` block gets a Supabase preview branch, and
# that branch's keys written to the project's Cloudflare preview Worker. It
# runs beside the PR's runs and never touches the box. Unset, a declared
# preview is marked failed with that reason.
# PREVIEW_PROVIDER = "supabase-cloudflare"
# CLOUDFLARE_ACCOUNT_ID = "dd3bee1c1159eb67e1a2249f83e2b4c4"
# PREVIEW_TIMEOUT_MINUTES = "20"
# PREVIEW_POLL_SECONDS = "20"
# DEV-ONLY: when "1", unlocks /api/debug/stub-run which fabricates runs
# without bearer auth. Defaults off so `wrangler deploy` is safe; enable
# locally via .dev.vars (see .dev.vars.example).
ENABLE_DEBUG_ROUTES = "0"
# Secrets (set via `wrangler secret put`; locally in .dev.vars — see
# .dev.vars.example):
#   GITHUB_OAUTH_CLIENT_SECRET
#   GITHUB_WEBHOOK_SECRET
#   SESSION_SECRET
#   DO_API_TOKEN          (only when RUNNER_PROVIDER = "digitalocean")
#   SUPABASE_ACCESS_TOKEN (only when PREVIEW_PROVIDER = "supabase-cloudflare")
#   CLOUDFLARE_API_TOKEN  (only when PREVIEW_PROVIDER = "supabase-cloudflare")

# Production environment — deploy with: wrangler deploy --env production
# Vars here replace (not merge with) the top-level [vars] block.
[env.production]
name = "scenetest-cloud"
workers_dev = false

[[env.production.routes]]
pattern = "ci.msnook.xyz"
zone_name = "msnook.xyz"
custom_domain = true

[env.production.durable_objects]
bindings = [
  { name = "PR_COORDINATOR", class_name = "PrCoordinator" },
  { name = "HOME_COORDINATOR", class_name = "HomeCoordinator" },
  { name = "PREVIEW_COORDINATOR", class_name = "PreviewCoordinator" },
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "scenetest-cloud-mhsnook"
database_id = "59cdeb29-a690-46b8-a8f9-423be56ed4d8"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "scenetest-cloud-artifacts"

[env.production.vars]
GITHUB_OAUTH_CLIENT_ID = "Iv23lirXMXY2Wpn6xdx5"
RUNNER_PROVIDER = "digitalocean"
RUNNER_REGION = "blr1"
RUNNER_SIZE = "s-2vcpu-4gb"
PUBLIC_BASE_URL = "https://ci.msnook.xyz"
BOOTSTRAP_ALLOWED_LOGIN = "mhsnook"
ENABLE_DEBUG_ROUTES = "0"
